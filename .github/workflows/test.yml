# Lint + test on every push/PR. Small tools still get a green check before they ship.
name: test
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install click pytest ruff
      - run: ruff check examples/
      - run: python -m pytest examples/
